<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - SHOP.CO</title>

    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/toast.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="../js/components.js" defer></script>
</head>
<body>

    <div id="navbar-container"></div>

    <main class="cart-page">

        <div class="breadcrumb">
            <a href="../index.html">Home</a>
            <span>›</span>
            <p>Cart</p>
        </div>

        <h1>Your Cart</h1>

        <section class="cart-layout">

            <div class="cart-items" id="cart-items"></div>

            <div class="order-summary" id="order-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <strong id="subtotal">$0</strong>
                </div>

                <div class="summary-row">
                    <span>Discount (-20%)</span>
                    <strong class="discount-price" id="discount">-$0</strong>
                </div>

                <div class="summary-row">
                    <span>Delivery Fee</span>
                    <strong id="delivery-fee">$0</strong>
                </div>

                <div class="summary-line"></div>

                <div class="summary-row total-row">
                    <span>Total</span>
                    <strong id="total-price">$0</strong>
                </div>

                <div class="promo-box">
                    <input type="text" id="promo-code" placeholder="🏷️  Add promo code">
                    <button>Apply</button>
                </div>

                <button class="checkout-btn">
                    Go to Checkout →
                </button>

            </div>

        </section>

    </main>

    <div id="newsletter-container"></div>

    <div id="footer-container"></div>

    <script src="../js/cartCounter.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/cart.js"></script>

</body>
</html>
