<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - SHOP.CO</title>

    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/footer.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="../js/components.js" defer></script>
</head>
<body>

    <div id="navbar-container"></div>

    <main class="cart-page">

        <!-- Breadcrumb -->

        <div class="breadcrumb">
            <a href="../index.html">Home</a>
            <span>›</span>
            <p>Cart</p>
        </div>

        <!-- Title -->

        <h1>Your Cart</h1>

        <!-- Main Layout -->

        <section class="cart-layout">

            <!-- Left Side -->

            <div class="cart-items" id="cart-items">

                <div class="cart-item">
                    <img src="../images/product1.png" alt="Gradient Graphic T-shirt">

                    <div class="cart-info">
                        <h3>Gradient Graphic T-shirt</h3>
                        <p>Size: <span>Large</span></p>
                        <p>Color: <span>White</span></p>
                        <h4>$145</h4>
                    </div>


<button class="delete-btn">
    <i class="fa-solid fa-trash"></i>
</button>
                    <div class="quantity-box">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                </div>

                <div class="cart-item">
                    <img src="../images/product5.png" alt="Checkered Shirt">

                    <div class="cart-info">
                        <h3>Checkered Shirt</h3>
                        <p>Size: <span>Medium</span></p>
                        <p>Color: <span>Red</span></p>
                        <h4>$180</h4>
                    </div>


<button class="delete-btn">
    <i class="fa-solid fa-trash"></i>
</button>
                    <div class="quantity-box">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                </div>

                <div class="cart-item">
                    <img src="../images/product4.png" alt="Skinny Fit Jeans">

                    <div class="cart-info">
                        <h3>Skinny Fit Jeans</h3>
                        <p>Size: <span>Large</span></p>
                        <p>Color: <span>Blue</span></p>
                        <h4>$240</h4>
                    </div>

<button class="delete-btn">
    <i class="fa-solid fa-trash"></i>
</button>
                    <div class="quantity-box">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                </div>

            </div>

            <!-- Right Side -->

<div class="order-summary" id="order-summary">

    <h2>Order Summary</h2>

    <div class="summary-row">
        <span>Subtotal</span>
        <strong id="subtotal">$565</strong>
    </div>

    <div class="summary-row">
        <span>Discount (-20%)</span>
        <strong class="discount-price" id="discount">-$113</strong>
    </div>

    <div class="summary-row">
        <span>Delivery Fee</span>
        <strong id="delivery-fee">$15</strong>
    </div>

    <div class="summary-line"></div>

    <div class="summary-row total-row">
        <span>Total</span>
        <strong id="total-price">$467</strong>
    </div>

    <div class="promo-box">
        <input type="text" id="promo-code" placeholder="🏷️  Add promo code">
        <button>Apply</button>
    </div>

    <button class="checkout-btn">
        Go to Checkout →
    </button>

</div>
                <!-- Next step mein banayenge -->

            </div>

        </section>

    </main>

    <div id="newsletter-container"></div>

    <div id="footer-container"></div>

</body>
</html>
